name: Build cu129 wheel

# 在 GitHub 托管 runner 中通过 CUDA 12.9 Docker 镜像编译 native csrc。
# 流程：拉 tag → 应用 PR #38669 → Docker 编译 csrc → 合并官方 cu129 Python wheel → 发布 Release。

on:
  schedule:
    - cron: '0 22 * * *'  # 每天北京时间 06:00（UTC 前一天 22:00）
  workflow_dispatch:
    inputs:
      ref:
        description: 'vllm ref (tag/branch/commit)。默认: 上游最新 stable tag'
        required: false
        default: ''
      force:
        description: '强制重建 (即使 Release 已存在)'
        required: false
        default: 'false'
      reuse_csrc_run:
        description: '仅手动验证打包时复用已有 run 的 csrc artifact；留空则完整构建'
        required: false
        default: ''
      arch_list:
        description: 'CUDA arch list，默认 9.0（H100/H200）；需要 Ampere 时填 8.0 9.0'
        required: false
        default: '9.0'

permissions:
  actions: read
  contents: write

env:
  CUDA_ARCH_LIST: ${{ inputs.arch_list || '9.0' }}
  PR_NUMBER: "38669"
  # Wheel version components cannot contain hyphens because wheel filenames
  # use hyphens as field separators. Keep the GitHub Release tag readable,
  # but normalize the local version embedded in the wheel.
  WHEEL_VERSION_LABEL: "cu129.marlin.fix"
  RELEASE_LABEL: "cu129-marlin-fix"
  CUDA_VERSION: "12.9.1"
  BUILD_BASE_IMAGE: "pytorch/manylinux2_28-builder:cuda12.9"

concurrency:
  group: cu129-wheel-${{ inputs.ref || 'latest-stable' }}
  # 手动重试不能中止已在编译的任务；同版本任务依次执行。
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.resolve_ref.outputs.ref }}
      skip: ${{ steps.check.outputs.skip }}
      cache_scope: ${{ steps.cache_scope.outputs.scope }}
    steps:
      - name: Resolve vllm ref
        id: resolve_ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT_REF='${{ inputs.ref }}'
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
          else
            REF=$(gh api repos/vllm-project/vllm/tags --paginate --jq '.[].name' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -1)
            if [ -z "$REF" ]; then
              echo "Failed to fetch latest stable tag from vllm-project/vllm"
              exit 1
            fi
          fi
          echo "Resolved ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF='${{ steps.resolve_ref.outputs.ref }}'
          FORCE='${{ inputs.force || 'false' }}'
          VER="${REF#v}"
          TAG="vllm-v${VER}+${RELEASE_LABEL}"
          if [ "$FORCE" = "true" ]; then
            echo "Force rebuild requested"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist, will build"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute BuildKit cache scope
        id: cache_scope
        run: |
          REF='${{ steps.resolve_ref.outputs.ref }}'
          SAFE_REF=$(printf '%s' "$REF" | tr '/:' '--')
          echo "scope=cu129-vllm-${SAFE_REF}" >> "$GITHUB_OUTPUT"

  build-csrc:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true' && inputs.reuse_csrc_run == ''
    runs-on: ubuntu-latest
    # Keep this below GitHub-hosted runner's six-hour hard limit.
    timeout-minutes: 350
    env:
      REF: ${{ needs.prepare.outputs.ref }}
      CACHE_SCOPE: ${{ needs.prepare.outputs.cache_scope }}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/.ghcup /usr/local/lib/node_modules /opt/ghc /usr/local/share/ghcup 2>/dev/null || true
          sudo apt-get clean
          docker system prune -af --volumes 2>/dev/null || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Checkout vllm at ${{ needs.prepare.outputs.ref }}
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 1

      - name: Apply PR #${{ env.PR_NUMBER }} (Marlin MoE sm_90 PTX compat)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${PR_NUMBER} -R vllm-project/vllm > /tmp/pr.patch
          git apply --verbose /tmp/pr.patch
          git status --short

      - name: Use Release CMake build type and skip Machete on hosted runner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dockerfile = Path("docker/Dockerfile")
          text = dockerfile.read_text()
          marker = "FROM base AS csrc-build\n"
          injection = marker + "ENV CMAKE_BUILD_TYPE=Release\n"
          if "ENV CMAKE_BUILD_TYPE=Release" not in text:
              if marker not in text:
                  raise SystemExit("csrc-build stage not found in docker/Dockerfile")
              dockerfile.write_text(text.replace(marker, injection, 1))

          # Export the csrc wheel as a small, explicit cross-job artifact.
          # The GitHub Actions cache backend is not reliable for this
          # multi-gigabyte BuildKit graph, while the wheel itself is enough
          # for the package stage's precompiled-extension path.
          dockerfile = Path("docker/Dockerfile")
          text = dockerfile.read_text()
          marker = "FROM base AS extensions-build\n"
          injection = (
              "FROM scratch AS csrc-wheel-artifact\n"
              "COPY --from=csrc-build /workspace/dist/ /\n\n"
              + marker
          )
          if "FROM scratch AS csrc-wheel-artifact" not in text:
              if marker not in text:
                  raise SystemExit("extensions-build stage not found in docker/Dockerfile")
              dockerfile.write_text(text.replace(marker, injection, 1))

          # Machete's generated Hopper dispatch translation unit is the first
          # template-heavy CUDA target on the 4-core/16-GB hosted runner. It
          # repeatedly receives SIGTERM around [37/421] before the csrc cache
          # can be exported. Marlin (including PR #38669's native sm_90/PTX
          # fix) remains enabled; vLLM falls back when Machete is unavailable.
          cmake = Path("CMakeLists.txt")
          text = cmake.read_text()
          marker = '    cuda_archs_loose_intersection(MACHETE_ARCHS "9.0a" "${CUDA_ARCHS}")'
          replacement = (
              "    # Hosted cu129 builds skip generated Machete kernels to stay "
              "within the runner memory limit.\n"
              "    set(MACHETE_ARCHS)"
          )
          if marker not in text:
              raise SystemExit("MACHETE_ARCHS declaration not found")
          cmake.write_text(text.replace(marker, replacement, 1))

          PY

      - name: Build C++/CUDA extension wheel and export artifact
        run: |
          set -euxo pipefail
          # Keep two nvcc processes on the 4-core/16-GB hosted runner. Three
          # concurrent template-heavy nvcc jobs lost runner communication;
          # the previous two-way build reached wheel creation in about 5h06m.
          mkdir -p artifacts/csrc-wheel
          docker buildx build --progress=plain \
            --build-arg max_jobs=2 \
            --build-arg nvcc_threads=1 \
            --build-arg USE_SCCACHE=0 \
            --build-arg CUDA_VERSION=${CUDA_VERSION} \
            --build-arg torch_cuda_arch_list="${CUDA_ARCH_LIST}" \
            --build-arg BUILD_OS=manylinux \
            --build-arg BUILD_BASE_IMAGE=${BUILD_BASE_IMAGE} \
            --target csrc-wheel-artifact \
            --output "type=local,dest=artifacts/csrc-wheel" \
            -f docker/Dockerfile .
          test "$(find artifacts/csrc-wheel -maxdepth 1 -name 'vllm-*.whl' | wc -l)" -eq 1
          ls -lh artifacts/csrc-wheel

      - name: Upload csrc wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: csrc-wheel-${{ needs.prepare.outputs.cache_scope }}
          path: artifacts/csrc-wheel/vllm-*.whl
          if-no-files-found: error
          retention-days: 2

  package:
    needs: [prepare, build-csrc]
    if: >-
      always() && needs.prepare.outputs.skip != 'true' &&
      (needs.build-csrc.result == 'success' || inputs.reuse_csrc_run != '')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      REF: ${{ needs.prepare.outputs.ref }}
      CACHE_SCOPE: ${{ needs.prepare.outputs.cache_scope }}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/.ghcup /usr/local/lib/node_modules /opt/ghc /usr/local/share/ghcup 2>/dev/null || true
          sudo apt-get clean
          docker system prune -af --volumes 2>/dev/null || true
          df -h /

      - name: Checkout vllm at ${{ needs.prepare.outputs.ref }}
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 1

      - name: Apply PR #${{ env.PR_NUMBER }} (Marlin MoE sm_90 PTX compat)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${PR_NUMBER} -R vllm-project/vllm > /tmp/pr.patch
          git apply --verbose /tmp/pr.patch
          git status --short

      - name: Download csrc wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: csrc-wheel-${{ needs.prepare.outputs.cache_scope }}
          path: precompiled-wheels
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.reuse_csrc_run || github.run_id }}

      - name: Download official cu129 wheel and merge PR native libraries
        run: |
          set -euxo pipefail
          mkdir -p artifacts/dist
          UPSTREAM_COMMIT=$(git rev-parse HEAD)
          export UPSTREAM_COMMIT
          METADATA_URL="https://wheels.vllm.ai/${UPSTREAM_COMMIT}/cu129/vllm/metadata.json"
          curl --fail --location --retry 3 --retry-delay 2 "$METADATA_URL" \
            -o /tmp/vllm-cu129-metadata.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urljoin

          metadata_url = Path("/tmp/vllm-cu129-metadata.json")
          entries = json.loads(metadata_url.read_text())
          matches = [
              entry for entry in entries
              if entry.get("python_tag") == "cp38"
              and entry.get("abi_tag") == "abi3"
              and entry.get("platform_tag") == "manylinux_2_28_x86_64"
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one x86_64 cp38-abi3 cu129 wheel, got {matches}")
          entry = matches[0]
          wheel_url = urljoin(
              f"https://wheels.vllm.ai/{os.environ['UPSTREAM_COMMIT']}/cu129/vllm/metadata.json",
              entry["path"],
          )
          Path("/tmp/vllm-cu129-wheel-url").write_text(wheel_url)
          Path("/tmp/vllm-cu129-wheel-name").write_text(entry["filename"])
          print(f"Official wheel: {entry['filename']}")
          print(f"Wheel URL: {wheel_url}")
          PY
          OFFICIAL_NAME=$(cat /tmp/vllm-cu129-wheel-name)
          OFFICIAL_WHEEL="/tmp/${OFFICIAL_NAME}"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$(cat /tmp/vllm-cu129-wheel-url)" -o "$OFFICIAL_WHEEL"
          CSRC_WHEEL=$(find precompiled-wheels -maxdepth 1 -name 'vllm-*.whl' -print -quit)
          test -n "$CSRC_WHEEL"
          export OFFICIAL_WHEEL CSRC_WHEEL
          export UPSTREAM_COMMIT
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          import time
          import zipfile
          from pathlib import Path

          official = Path(os.environ["OFFICIAL_WHEEL"])
          csrc = Path(os.environ["CSRC_WHEEL"])
          patched_ops = Path("vllm/_custom_ops.py").read_bytes()
          output = Path("artifacts/dist") / official.name
          native_paths = {
              "vllm/_C_stable_libtorch.abi3.so",
              "vllm/_moe_C_stable_libtorch.abi3.so",
          }
          with zipfile.ZipFile(csrc) as archive:
              replacements = {path: archive.read(path) for path in native_paths}
          if "+csrc.build.cu129-" not in csrc.name:
              raise SystemExit(f"unexpected csrc wheel provenance: {csrc.name}")

          dist_infos = []
          with zipfile.ZipFile(official) as archive:
              for name in archive.namelist():
                  if name.endswith(".dist-info/METADATA"):
                      dist_infos.append(name.split("/", 1)[0])
          if len(dist_infos) != 1:
              raise SystemExit(f"expected one official dist-info directory, got {dist_infos}")
          print(f"Official dist-info: {dist_infos[0]}")

          start = time.time()
          count = 0
          with zipfile.ZipFile(official) as source, zipfile.ZipFile(
              output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6
          ) as destination:
              for info in source.infolist():
                  if info.filename.endswith(".dist-info/RECORD"):
                      continue
                  if info.filename in native_paths:
                      data = replacements[info.filename]
                  elif info.filename == "vllm/_custom_ops.py":
                      data = patched_ops
                  else:
                      data = source.read(info.filename)
                  destination.writestr(info, data)
                  count += 1

          with zipfile.ZipFile(output, "a", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              rows = []
              for name in sorted(archive.namelist()):
                  if name.endswith(".dist-info/RECORD"):
                      continue
                  data = archive.read(name)
                  digest = base64.urlsafe_b64encode(hashlib.sha256(data).digest()).decode().rstrip("=")
                  rows.append(f"{name},sha256={digest},{len(data)}")
              record_name = f"{dist_infos[0]}/RECORD"
              rows.append(f"{record_name},,")
              archive.writestr(record_name, "\n".join(rows) + "\n")

          with zipfile.ZipFile(output) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("merged wheel ZIP integrity check failed")
              for path, expected in replacements.items():
                  if archive.read(path) != expected:
                      raise SystemExit(f"native replacement verification failed: {path}")
              if archive.read("vllm/_custom_ops.py") != patched_ops:
                  raise SystemExit("PR Python patch verification failed")
          print(f"Merged wheel: {output} ({output.stat().st_size} bytes, {count + 1} entries, {time.time() - start:.1f}s)")
          PY
          ls -lh artifacts/dist/

      - name: Tag wheel with +${{ env.WHEEL_VERSION_LABEL }}
        id: rename
        working-directory: artifacts/dist
        run: |
          set -euo pipefail
          WHEEL=$(ls vllm-*.whl | head -n1)
          LABEL='${{ env.WHEEL_VERSION_LABEL }}'
          NEW=$(printf '%s' "$WHEEL" | sed -E "s|^(vllm-[0-9]+\.[0-9]+\.[0-9]+)(\+[^-]+)?-|\1+${LABEL}-|")
          mv "$WHEEL" "$NEW"
          echo "renamed=$NEW" >> "$GITHUB_OUTPUT"
          ls -lh "$NEW"

      - name: Update wheel metadata for the local version
        id: metadata
        working-directory: artifacts/dist
        env:
          WHEEL: ${{ steps.rename.outputs.renamed }}
          LABEL: ${{ env.WHEEL_VERSION_LABEL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          import zipfile
          from pathlib import Path

          source = Path(os.environ["WHEEL"])
          label = os.environ["LABEL"]
          stem = source.stem
          marker = stem.find("-cp")
          if marker < 0:
              raise SystemExit(f"cannot parse wheel tags: {source.name}")
          version = stem[len("vllm-"):marker]
          tags = stem[marker + 1:]
          base_version = version.split("+", 1)[0]
          new_version = f"{base_version}+{label}"
          new_name = f"vllm-{new_version}-{tags}.whl"

          with tempfile.TemporaryDirectory() as temp_dir:
              root = Path(temp_dir)
              with zipfile.ZipFile(source) as archive:
                  archive.extractall(root)

              dist_infos = list(root.glob("vllm-*.dist-info"))
              if len(dist_infos) != 1:
                  raise SystemExit(f"expected one dist-info directory, got {dist_infos}")
              old_dist_info = dist_infos[0]
              new_dist_info = root / f"vllm-{new_version}.dist-info"
              old_dist_info.rename(new_dist_info)

              metadata_path = new_dist_info / "METADATA"
              metadata = metadata_path.read_text()
              metadata, count = re.subn(
                  r"(?m)^Version: .*?$",
                  f"Version: {new_version}",
                  metadata,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Version field not found in wheel METADATA")
              metadata_path.write_text(metadata)

              record_path = new_dist_info / "RECORD"
              record_rel = record_path.relative_to(root).as_posix()
              rows = []
              for file_path in sorted(root.rglob("*")):
                  if not file_path.is_file():
                      continue
                  relative = file_path.relative_to(root).as_posix()
                  if relative == record_rel:
                      continue
                  digest = base64.urlsafe_b64encode(
                      hashlib.sha256(file_path.read_bytes()).digest()
                  ).decode().rstrip("=")
                  rows.append(f"{relative},sha256={digest},{file_path.stat().st_size}")
              rows.append(f"{record_rel},,")
              record_path.write_text("\n".join(rows) + "\n")

              output = root.parent / new_name
              with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as archive:
                  for file_path in sorted(root.rglob("*")):
                      if file_path.is_file():
                          archive.write(file_path, file_path.relative_to(root).as_posix())
              shutil.move(output, source)

          final_path = source.with_name(new_name)
          source.rename(final_path)
          print(f"normalized wheel: {final_path.name}")
          with final_path.open("rb") as archive_file:
              with zipfile.ZipFile(archive_file) as archive:
                  metadata_name = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
                  metadata = archive.read(metadata_name).decode()
                  if f"Version: {new_version}" not in metadata:
                      raise SystemExit("normalized METADATA version check failed")
          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "--disable-pip-version-check",
                  "--dry-run",
                  "--no-deps",
                  str(final_path),
              ],
              check=True,
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output_file:
              output_file.write(f"wheel={final_path.name}\n")
          PY

      - name: Resolve version
        id: ver
        run: |
          W='${{ steps.metadata.outputs.wheel }}'
          V=$(printf '%s' "$W" | sed -E 's|^vllm-||; s|\.whl$||; s|-cp[0-9]+.*||; s|-py3.*||')
          printf 'version=%s\n' "$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: vllm-${{ needs.prepare.outputs.ref }}+${{ env.RELEASE_LABEL }}
          TITLE: vllm ${{ steps.ver.outputs.version }}
          WHEEL: artifacts/dist/${{ steps.metadata.outputs.wheel }}
          # The upstream tag is not guaranteed to exist in this fork. The
          # release tag must therefore target the workflow's fork commit;
          # the Release notes retain the upstream ref used for the wheel.
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f "$WHEEL"
          cat > release-notes.md <<'EOF'
          vllm wheel built from upstream `${{ needs.prepare.outputs.ref }}` + PR #${{ env.PR_NUMBER }} (Marlin MoE sm_90 PTX compat fix).

          The Python wheel is based on the official upstream cu129 wheel. The two Marlin native libraries are replaced with the csrc wheel built from PR #${{ env.PR_NUMBER }} (CUDA ${{ env.CUDA_VERSION }}, arch list: `${{ env.CUDA_ARCH_LIST }}`), and the PR's Python diagnostic patch is included.

          ## Install

          ```bash
          pip install --no-deps --force-reinstall <WHEEL_URL>
          ```

          Use `--no-deps` to preserve your existing CUDA 12.9 vllm deps (torch, etc.).
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$WHEEL" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file release-notes.md
          else
            gh release create "$TAG" "$WHEEL" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --latest=false
          fi
