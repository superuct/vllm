name: Build cu129 wheel

# 在 self-hosted runner (cu129-builder) 上原生构建 vllm cu129 wheel。
# 服务器：hadoop-hmart-fsp-ml@10.24.171.203，16 核 64GB RAM + 50GB 盘，
# 已装 CUDA 12.9 toolkit (/usr/local/cuda-12.9)，通过 corp proxy 联网。
#
# 流程：拉 tag → 应用 PR #38669 → 用 venv 装 torch cu129 + 构建依赖 →
#       pip wheel 原生编译 CUDA → 重命名加 +cu129-marlin-fix → 发布 Release

on:
  schedule:
    - cron: '23 6 * * *'  # 每天 06:23 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: 'vllm ref (tag/branch/commit)。默认: 上游最新 stable tag'
        required: false
        default: ''
      force:
        description: '强制重建 (即使 Release 已存在)'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  CUDA_ARCH_LIST: "8.0 9.0"
  PR_NUMBER: "38669"
  VERSION_LABEL: "cu129-marlin-fix"
  CUDA_VERSION: "12.9"
  HTTPS_PROXY: http://11.44.127.31:8420
  HTTP_PROXY: http://11.44.127.31:8420
  NO_PROXY: localhost,127.0.0.1,.svc.cluster.local,.sankuai.com
  CUDA_HOME: /usr/local/cuda-12.9
  PIP_INDEX_URL: https://pypi.mirrors.ustc.edu.cn/simple/
  PIP_TRUSTED_HOST: pypi.mirrors.ustc.edu.cn

jobs:
  build:
    runs-on: [self-hosted, cu129-builder]
    timeout-minutes: 240
    steps:
      - name: Resolve vllm ref
        id: resolve_ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          https_proxy: ${{ env.HTTPS_PROXY }}
          http_proxy: ${{ env.HTTP_PROXY }}
        run: |
          INPUT_REF='${{ inputs.ref }}'
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
          else
            REF=$(gh api repos/vllm-project/vllm/tags --paginate --jq '.[].name' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -1)
            if [ -z "$REF" ]; then
              echo "Failed to fetch latest stable tag from vllm-project/vllm"
              exit 1
            fi
          fi
          echo "Resolved ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          https_proxy: ${{ env.HTTPS_PROXY }}
          http_proxy: ${{ env.HTTP_PROXY }}
        run: |
          REF='${{ steps.resolve_ref.outputs.ref }}'
          FORCE='${{ inputs.force || 'false' }}'
          VER="${REF#v}"
          TAG="vllm-v${VER}+${VERSION_LABEL}"
          if [ "$FORCE" = "true" ]; then
            echo "Force rebuild requested"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist, will build"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout vllm at ${{ steps.resolve_ref.outputs.ref }}
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: ${{ steps.resolve_ref.outputs.ref }}
          fetch-depth: 1

      - name: Apply PR #${{ env.PR_NUMBER }} (Marlin MoE sm_90 PTX compat)
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          https_proxy: ${{ env.HTTPS_PROXY }}
          http_proxy: ${{ env.HTTP_PROXY }}
        run: |
          gh pr diff ${PR_NUMBER} -R vllm-project/vllm > /tmp/pr.patch
          echo "==== patch summary (first 30 lines) ===="
          head -30 /tmp/pr.patch
          echo "==== applying ===="
          git apply --verbose /tmp/pr.patch
          echo "==== changed files ===="
          git status --short

      - name: Set up build venv (cached on runner)
        if: steps.check.outputs.skip != 'true'
        run: |
          VENV_DIR="$HOME/vllm-build-venv"
          if [ ! -d "$VENV_DIR" ]; then
            echo "Creating venv at $VENV_DIR"
            python3 -m venv "$VENV_DIR"
          fi
          source "$VENV_DIR/bin/activate"
          python -m pip install --upgrade pip
          # Build deps
          pip install cmake ninja wheel setuptools setuptools-scm uv
          # torch cu129 (PyTorch official index)
          pip install --index-url https://download.pytorch.org/whl/cu129 torch==2.11.0
          echo "VENV_DIR=$VENV_DIR" >> "$GITHUB_ENV"

      - name: Build wheel (native, no Docker)
        if: steps.check.outputs.skip != 'true'
        env:
          CUDA_HOME: ${{ env.CUDA_HOME }}
          TORCH_CUDA_ARCH_LIST: ${{ env.CUDA_ARCH_LIST }}
          MAX_JOBS: "8"
          PATH: ${{ env.CUDA_HOME }}/bin:/usr/bin:/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin
          LD_LIBRARY_PATH: ${{ env.CUDA_HOME }}/lib64
        run: |
          source "$VENV_DIR/bin/activate"
          # Sanity: nvcc available
          which nvcc && nvcc --version | head -3
          # Build wheel in dist/
          rm -rf dist build
          python -m pip wheel . --no-build-isolation -w dist/
          echo "==== built wheels ===="
          ls -lh dist/

      - name: Tag wheel with +${{ env.VERSION_LABEL }}
        if: steps.check.outputs.skip != 'true'
        id: rename
        working-directory: dist
        run: |
          set -euo pipefail
          WHEEL=$(ls vllm-*.whl | head -n1)
          LABEL='${{ env.VERSION_LABEL }}'
          NEW=$(printf '%s' "$WHEEL" | sed -E "s|^(vllm-[0-9]+\.[0-9]+\.[0-9]+)-|\1+${LABEL}-|")
          mv "$WHEEL" "$NEW"
          echo "renamed=$NEW" >> "$GITHUB_OUTPUT"
          ls -lh "$NEW"

      - name: Resolve version
        if: steps.check.outputs.skip != 'true'
        id: ver
        run: |
          W='${{ steps.rename.outputs.renamed }}'
          V=$(printf '%s' "$W" | sed -E 's|^vllm-||; s|\.whl$||; s|-cp[0-9]+.*||; s|-py3.*||')
          printf 'version=%s\n' "$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Create GitHub Release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vllm-v${{ steps.ver.outputs.version }}
          name: vllm ${{ steps.ver.outputs.version }}
          body: |
            vllm wheel built from upstream `${{ steps.resolve_ref.outputs.ref }}` + PR #${{ env.PR_NUMBER }} (Marlin MoE sm_90 PTX compat fix).

            Built natively on self-hosted runner (CUDA ${{ env.CUDA_VERSION }}, arch list: `${{ env.CUDA_ARCH_LIST }}`).

            ## Install

            ```bash
            pip install --no-deps --force-reinstall <WHEEL_URL>
            ```

            Use `--no-deps` to preserve your existing CUDA 12.9 vllm deps (torch, etc.).
          files: dist/${{ steps.rename.outputs.renamed }}
          fail_on_unmatched_files: true
          make_latest: false
